services:
    server:
        build: .
        container_name: server
        restart: always
        init: true
        ports:
            - "8080:8080"
        networks:
            h42n42:
        healthcheck:
            test: "exit 0"
            interval: 5s
            timeout: 1m
            retries: 3


networks:
    h42n42:
        driver: bridge